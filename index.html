<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>島谷HC 相談窓口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 構成：スマホで片手で使う 1 列。上に合言葉、まん中に会話（古いものが上）、下に入力欄。兵頭さんの窓口と同じ作り */
:root{
  --bg:#f4f6fa; --paper:#ffffff; --ink:#161c2b; --ink-2:#434b5e; --muted:#6a7287; --rule:#d6dbe6;
  --accent:#3a4a85; --accent-ink:#ffffff; --soft:#e9edf6; --me:#eef1f8; --warn:#8a5a00; --warn-bg:#fbf3e3; --err:#a3302a; --err-bg:#fbeceb;
  --f:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --paper:#171c2c; --ink:#e4e7f0; --ink-2:#b8bfd2; --muted:#8f97ad; --rule:#2c3348;
  --accent:#8fa2e6; --accent-ink:#0d1222; --soft:#1e2539; --me:#1c2336; --warn:#e7c27a; --warn-bg:#2d2615; --err:#f0928b; --err-bg:#331b1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1320; --paper:#171c2c; --ink:#e4e7f0; --ink-2:#b8bfd2; --muted:#8f97ad; --rule:#2c3348;
  --accent:#8fa2e6; --accent-ink:#0d1222; --soft:#1e2539; --me:#1c2336; --warn:#e7c27a; --warn-bg:#2d2615; --err:#f0928b; --err-bg:#331b1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;line-height:1.4;margin:0}
.lead{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted);margin-left:auto}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--accent);background:var(--paper);color:var(--accent);padding:8px 16px;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.status{font-size:13.5px;color:var(--ink-2)}
.msg{border-radius:8px;padding:10px 12px;font-size:14.5px}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg.wait{background:var(--soft)}
.log{display:flex;flex-direction:column;gap:10px}
.bubble{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{background:var(--me);margin-left:24px}
.bubble.ai{background:var(--paper);margin-right:24px}
.bubble .who{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.past-head{font-size:13.5px;font-weight:700;color:var(--ink-2);margin:0}
.docs details{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin-top:8px}
.docs summary{cursor:pointer;font-weight:700;color:var(--accent);min-height:28px}
.doc{font-size:14.5px;overflow-wrap:anywhere}
.doc h3{font-size:17px;margin:14px 0 6px}.doc h4{font-size:15.5px;margin:12px 0 4px}.doc h5{font-size:14.5px;margin:10px 0 4px}
.doc p,.doc ul{margin:4px 0}.doc ul{padding-left:20px}
.doc blockquote{margin:6px 0;padding:6px 10px;background:var(--warn-bg);color:var(--warn);border-radius:6px}
.doc pre{white-space:pre-wrap;background:var(--soft);border-radius:6px;padding:8px 10px;font:inherit;font-size:13.5px;margin:6px 0}
.doc .tbl{overflow-x:auto;margin:6px 0}
.doc table{border-collapse:collapse;font-size:13px;min-width:100%}
.doc th,.doc td{border:1px solid var(--rule);padding:4px 6px;vertical-align:top;text-align:left;min-width:6.5em}
.doc th{background:var(--soft)}
.divider{font-size:12.5px;color:var(--muted);text-align:center;border-top:1px solid var(--rule);padding-top:6px;margin-top:4px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>島谷HC 相談窓口</h1>
    <p class="lead">モーグル日本代表の協賛獲得と SNS について、島谷さんが考えを整理したり、資料を確かめたりするための相談窓口です。AI がチームの共有資料をもとに答え、前回までの話を覚えて次の会話に引き継ぎます。</p>
  </header>

  <p class="note">AI の答えは案で、AI は何も決めません。決めるのは島谷さんと城さんです。会話の内容と、AI がまとめた引き継ぎ（島谷さんの提案・依頼を含む）はチームの記録として残し、実務を受け持つ城さんと共有します。選手の個人情報やパスワードは書かないでください。</p>

  <section class="card" aria-label="合言葉">
    <label for="pass">合言葉</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="城さんから聞いた合言葉">
    <div class="status" id="usage" aria-live="polite"></div>
  </section>

  <section class="docs" id="docs" aria-label="資料"></section>
  <section class="log" id="past" aria-label="これまでのやりとり"></section>
  <section class="log" id="log" aria-label="会話" aria-live="polite"></section>
  <div id="msg" aria-live="polite"></div>

  <section class="card" aria-label="質問">
    <label for="question">質問・相談</label>
    <textarea id="question" maxlength="1000" placeholder="例：前回の続きから。所属先に協賛を持ちかけるかについて、私の考えは…"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="send" type="button">送る</button>
      <button id="restart" type="button">新しい会話</button>
      <span class="count" id="count">0 / 1000</span>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script>
(function () {
  var API = (window.QA_CONFIG || {}).API_URL || '';
  var $ = function (id) { return document.getElementById(id); };
  var sessionId = '';
  var busy = false;
  var POLL_MS = 3000, POLL_MAX = 100;   // 3 秒ごと、最大 5 分

  try { $('pass').value = sessionStorage.getItem('qa_pass') || ''; sessionId = sessionStorage.getItem('qa_sid') || ''; } catch (e) { /* 保存できない環境でも使える */ }

  function show(text, kind) {
    var el = $('msg');
    el.innerHTML = '';
    if (!text) return;
    var d = document.createElement('div');
    d.className = 'msg ' + (kind || '');
    d.textContent = text;
    el.appendChild(d);
  }
  function bubble(who, text, box, time) {
    var b = document.createElement('div');
    b.className = 'bubble ' + (who === 'me' ? 'me' : 'ai');
    var w = document.createElement('span'); w.className = 'who';
    w.textContent = (who === 'me' ? 'あなた' : 'AI') + (time ? '　' + time : '');
    b.appendChild(w);
    b.appendChild(document.createTextNode(text));
    (box || $('log')).appendChild(b);
    if (!box) b.scrollIntoView({ block: 'nearest' });
  }
  function line(box, cls, text) {
    var p = document.createElement('p'); p.className = cls; p.textContent = text; box.appendChild(p);
  }
  /** 資料の Markdown を、見出し・箇条書き・表・引用・枠だけの簡単な形で描く（文字は textContent で入れる） */
  function renderDoc(md) {
    var root = document.createElement('div'); root.className = 'doc';
    var lines = String(md).split('\n'), i = 0;
    function el(tag, text) { var e = document.createElement(tag); if (text != null) e.textContent = text.replace(/\*\*/g, ''); return e; }
    function cells(l) { return l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); }); }
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        root.appendChild(el('pre', buf.join('\n'))); i++; continue;
      }
      if (/^\s*\|/.test(l)) {
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
        var wrap = el('div'); wrap.className = 'tbl';
        var t = el('table');
        rows.forEach(function (r, k) {
          if (r.every(function (c) { return /^:?-+:?$/.test(c); })) return;   // 区切りの行
          var tr = el('tr');
          r.forEach(function (c) { tr.appendChild(el(k === 0 ? 'th' : 'td', c)); });
          t.appendChild(tr);
        });
        wrap.appendChild(t); root.appendChild(wrap); continue;
      }
      if (/^\s*[-*] /.test(l) || /^\s*\d+\. /.test(l)) {
        var ul = el('ul');
        while (i < lines.length && (/^\s*[-*] /.test(lines[i]) || /^\s*\d+\. /.test(lines[i]))) {
          ul.appendChild(el('li', lines[i].replace(/^\s*[-*] /, '').replace(/^\s*(\d+\.) /, '$1 '))); i++;
        }
        root.appendChild(ul); continue;
      }
      var h = /^(#{1,3}) (.*)$/.exec(l);
      if (h) root.appendChild(el('h' + (h[1].length + 2), h[2]));
      else if (/^> /.test(l)) root.appendChild(el('blockquote', l.slice(2)));
      else if (l.trim()) root.appendChild(el('p', l.replace(/~~/g, '')));
      i++;
    }
    return root;
  }
  /** 島谷HC に見せる資料（合言葉を入れたときだけ受け口から読む。公開のページのファイルには入れていない） */
  function loadDocs() {
    var box = $('docs');
    call({ action: 'docs' }).then(function (r) {
      box.innerHTML = '';
      if (!r.ok || !r.items.length) return;
      line(box, 'past-head', '資料（押すと開きます）');
      r.items.forEach(function (d) {
        var det = document.createElement('details');
        var s = document.createElement('summary'); s.textContent = d.title + '（' + d.asOf + ' 時点）';
        det.appendChild(s);
        det.addEventListener('toggle', function () { if (det.open && det.children.length === 1) det.appendChild(renderDoc(d.body)); });
        box.appendChild(det);
      });
    }).catch(function () { /* 資料が読めなくても会話は使える */ });
  }
  /** これまでのやりとり（記録から最近の分）。ページを開き直しても、LINE の中のブラウザでも同じものが出る */
  function loadHistory() {
    if (!API || !$('pass').value.trim()) return;
    var box = $('past');
    box.innerHTML = '';
    line(box, 'status', 'これまでのやりとりを読んでいます…');
    call({ action: 'history' }).then(function (r) {
      box.innerHTML = '';
      if (!r.ok) { line(box, 'status', r.message || 'これまでのやりとりを読めませんでした'); return; }
      remember();
      loadDocs();
      line(box, 'past-head', 'これまでのやりとり（最近の ' + r.items.length + ' 件）');
      if (!r.items.length) { line(box, 'status', 'まだやりとりはありません'); return; }
      r.items.forEach(function (it) {
        bubble('me', it.q, box, String(it.t).slice(0, 16));
        bubble('ai', it.a, box);
      });
      line(box, 'divider', 'ここから下が今の会話です');
    }).catch(function () { box.innerHTML = ''; line(box, 'status', 'これまでのやりとりを読めませんでした（通信）'); });
  }
  function setUsage(used, limit) {
    if (typeof used === 'number' && typeof limit === 'number') $('usage').textContent = '今日のメッセージ：' + used + ' / ' + limit + ' 回';
  }
  function call(body) {
    body.passphrase = $('pass').value.trim();
    return fetch(API, { method: 'POST', body: JSON.stringify(body) })   // 本文は text/plain で送る（Apps Script の受け口に合わせる）
      .then(function (r) { return r.json(); });
  }
  function remember() {
    try { sessionStorage.setItem('qa_pass', $('pass').value.trim()); sessionStorage.setItem('qa_sid', sessionId); } catch (e) { /* 保存できなくても続ける */ }
  }
  function done() { busy = false; $('send').disabled = false; }

  function poll(n) {
    call({ action: 'poll', sessionId: sessionId }).then(function (r) {
      if (!r.ok) { show(r.message || 'うまくいきませんでした', 'err'); if (r.error === 'expired') sessionId = ''; done(); return; }
      if (!r.done) {
        if (n >= POLL_MAX) { show('時間がかかっています。少ししてから「送る」で続けてください', 'err'); done(); return; }
        setTimeout(function () { poll(n + 1); }, POLL_MS);
        return;
      }
      show(r.note || '', r.note ? 'err' : '');
      if (r.text) bubble('ai', r.text);
      done();
    }).catch(function () { show('通信できませんでした。電波のよいところで、もう一度お試しください', 'err'); done(); });
  }

  function send() {
    var q = $('question').value.trim();
    if (busy) return;
    if (!API) { show('受け口がまだ設定されていません（城さんに連絡してください）', 'err'); return; }
    if (!$('pass').value.trim()) { show('合言葉を入れてください', 'err'); $('pass').focus(); return; }
    if (!q) { show('質問を入力してください', 'err'); $('question').focus(); return; }
    busy = true; $('send').disabled = true;
    var start = sessionId ? Promise.resolve({ ok: true, sessionId: sessionId }) : (show('会話を始めています', 'wait'), call({ action: 'start' }));
    start.then(function (r) {
      if (!r.ok) throw r;
      sessionId = r.sessionId; remember();
      return call({ action: 'send', sessionId: sessionId, text: q });
    }).then(function (r) {
      if (!r.ok) throw r;
      bubble('me', q);
      $('question').value = ''; $('count').textContent = '0 / 1000';
      setUsage(r.used, r.limit);
      show('AI が引き継ぎと資料を読んで答えています（30 秒〜2 分ほど）', 'wait');
      poll(0);
    }).catch(function (r) {
      if (r && r.error === 'expired') sessionId = '';
      show(r && r.message || '通信できませんでした。電波のよいところで、もう一度お試しください', 'err');
      done();
    });
  }

  $('send').addEventListener('click', send);
  $('restart').addEventListener('click', function () {
    if (busy) return;
    sessionId = ''; remember(); $('log').innerHTML = '';
    show('新しい会話にしました。前回までの話は AI が引き継いでいます', 'wait');
  });
  $('question').addEventListener('input', function () { $('count').textContent = $('question').value.length + ' / 1000'; });
  $('pass').addEventListener('change', loadHistory);
  loadHistory();
})();
</script>
</body>
</html>
